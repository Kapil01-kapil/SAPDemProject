specVersion: "3.0"
metadata:
  name: app.variant1
type: application
resources:
  configuration:
    propertiesFileSourceEncoding: UTF-8
customConfiguration:
  adp:
    safeMode: false
server:
  customMiddleware:
    - name: fiori-tools-preview
      afterMiddleware: compression
      configuration:
        adp:
          target: 
            url: http://s4hana.ides.com:8034
            client: '100'
          ignoreCertErrors: false
    - name: fiori-tools-proxy
      afterMiddleware: fiori-tools-preview
      configuration:
        ignoreCertErrors: false
        ui5:
          version: 1.127.1
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
        backend: 
          - url: http://s4hana.ides.com:8034
            client: '100'
            path: /sap
