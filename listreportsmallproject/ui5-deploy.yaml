# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "3.1"
metadata:
  name: listreportsmallproject
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          url: http://s4hana.ides.com:8034
          client: "100"
        app:
          name: ZLISTPROPORTPRO
          package: $tmp
          transport: $TMP
        exclude:
          - /test/
